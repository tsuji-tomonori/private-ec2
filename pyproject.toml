[project]
name = "private-ec2"
version = "0.1.0"
description = "Build EC2 in private network environment."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aws-cdk-lib>=2.216.0",
    "constructs>=10.4.2",
]

[dependency-groups]
dev = [
    "cdk-nag>=2.37.35",
    "pytest>=8.4.2",
    "ruff>=0.13.1",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]  # pycodestyle, Pyflakes, isort
fixable = ["ALL"]
